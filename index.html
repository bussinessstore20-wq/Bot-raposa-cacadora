<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Raposa Caçadora - Painel VIP</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        :root {
            --bg-gradient:
                linear-gradient(
                    135deg,
                    #05070a 0%,
                    #0d111a 100%
                );

            --card-bg:
                rgba(15, 23, 36, 0.88);

            --card-border:
                rgba(255, 255, 255, 0.08);

            --primary:
                #f97316;

            --primary-dark:
                #ea580c;

            --primary-light:
                #fdba74;

            --accent-glow:
                rgba(249, 115, 22, 0.45);

            --text-main:
                #f8fafc;

            --text-sub:
                #94a3b8;

            --input-bg:
                rgba(6, 10, 17, 0.95);

            --input-border:
                rgba(255, 255, 255, 0.12);

            --radius:
                16px;
        }


        * {
            box-sizing: border-box;

            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-tap-highlight-color:
                transparent;
        }


        html {
            background:
                #05070a;
        }


        body {
            background:
                var(--bg-gradient);

            color:
                var(--text-main);

            min-height:
                100vh;

            padding:
                20px 16px 30px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                18px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .brand-header {
            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            padding:
                4px 2px;
        }


        .brand-avatar {
            width:
                56px;

            height:
                56px;

            min-width:
                56px;

            border-radius:
                50%;

            background:
                #080b11;

            border:
                2px solid var(--primary);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                28px;

            box-shadow:
                0 0 25px var(--accent-glow);
        }


        .brand-title {
            min-width:
                0;
        }


        .brand-title h1 {
            font-size:
                1.22rem;

            font-weight:
                800;

            letter-spacing:
                -0.02em;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #fdba74
                );

            -webkit-background-clip:
                text;

            -webkit-text-fill-color:
                transparent;
        }


        .brand-title p {
            font-size:
                0.78rem;

            color:
                var(--text-sub);

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            margin-top:
                3px;
        }


        .status-badge {
            display:
                inline-block;

            width:
                8px;

            height:
                8px;

            background:
                #22c55e;

            border-radius:
                50%;

            box-shadow:
                0 0 8px #22c55e;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {
            background:
                var(--card-bg);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            border:
                1px solid var(--card-border);

            border-radius:
                var(--radius);

            padding:
                20px;

            box-shadow:
                0 10px 30px -10px
                rgba(0, 0, 0, 0.8);
        }


        .card-title {
            font-size:
                0.9rem;

            font-weight:
                700;

            color:
                var(--primary-light);

            text-transform:
                uppercase;

            letter-spacing:
                0.05em;

            margin-bottom:
                18px;

            display:
                flex;

            align-items:
                center;

            gap:
                8px;
        }


        /* =====================================================
           CAMPOS
        ===================================================== */

        .field-group {
            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

            margin-bottom:
                18px;
        }


        .field-group:last-child {
            margin-bottom:
                0;
        }


        label {
            font-size:
                0.82rem;

            font-weight:
                600;

            color:
                var(--text-sub);

            display:
                flex;

            align-items:
                center;

            gap:
                6px;
        }


        .input-wrapper-paste {
            display:
                flex;

            gap:
                8px;

            align-items:
                stretch;
        }


        .input-wrapper {
            position:
                relative;

            flex:
                1;

            min-width:
                0;
        }


        .input-wrapper i {
            position:
                absolute;

            left:
                14px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                #64748b;

            font-size:
                0.95rem;

            pointer-events:
                none;

            z-index:
                2;
        }


        input,
        select {
            width:
                100%;

            padding:
                14px 14px 14px 42px;

            border-radius:
                12px;

            border:
                1px solid var(--input-border);

            background:
                var(--input-bg);

            color:
                var(--text-main);

            font-size:
                0.92rem;

            outline:
                none;

            transition:
                all 0.25s ease;
        }


        input:focus,
        select:focus {
            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(249, 115, 22, 0.18);
        }


        input::placeholder {
            color:
                #64748b;
        }


        select {
            appearance:
                auto;
        }


        select option {
            background:
                #0f172a;

            color:
                #ffffff;
        }


        /* =====================================================
           BOTÃO COLAR
        ===================================================== */

        .btn-colar {
            background:
                rgba(249, 115, 22, 0.15);

            border:
                1px solid var(--primary);

            color:
                var(--primary-light);

            padding:
                14px 15px;

            border-radius:
                12px;

            font-size:
                0.82rem;

            font-weight:
                700;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;

            white-space:
                nowrap;

            transition:
                all 0.2s ease;
        }


        .btn-colar:active {
            transform:
                scale(0.96);

            background:
                rgba(249, 115, 22, 0.3);
        }


        /* =====================================================
           TEMPOS
        ===================================================== */

        .time-grid {
            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                8px;

            margin-top:
                4px;
        }


        .time-btn {
            background:
                var(--input-bg);

            border:
                1px solid var(--input-border);

            color:
                var(--text-sub);

            padding:
                10px 6px;

            border-radius:
                10px;

            font-size:
                0.8rem;

            font-weight:
                600;

            cursor:
                pointer;

            text-align:
                center;

            transition:
                all 0.2s ease;
        }


        .time-btn.active {
            background:
                rgba(249, 115, 22, 0.2);

            border-color:
                var(--primary);

            color:
                var(--primary);
        }


        /* =====================================================
           INFO
        ===================================================== */

        .info-box {
            margin-top:
                14px;

            padding:
                11px 12px;

            border-radius:
                10px;

            background:
                rgba(249, 115, 22, 0.07);

            border:
                1px solid
                rgba(249, 115, 22, 0.15);

            color:
                #cbd5e1;

            font-size:
                0.76rem;

            line-height:
                1.45;
        }


        .info-box i {
            color:
                var(--primary-light);

            margin-right:
                5px;
        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .mensagem {
            display:
                none;

            padding:
                13px;

            border-radius:
                12px;

            font-size:
                0.85rem;

            text-align:
                center;

            line-height:
                1.45;
        }


        .mensagem.sucesso {
            display:
                block;

            color:
                #86efac;

            background:
                rgba(34, 197, 94, 0.10);

            border:
                1px solid
                rgba(34, 197, 94, 0.25);
        }


        .mensagem.erro {
            display:
                block;

            color:
                #fca5a5;

            background:
                rgba(239, 68, 68, 0.10);

            border:
                1px solid
                rgba(239, 68, 68, 0.25);
        }


        .mensagem.info {
            display:
                block;

            color:
                #93c5fd;

            background:
                rgba(59, 130, 246, 0.10);

            border:
                1px solid
                rgba(59, 130, 246, 0.25);
        }


        /* =====================================================
           BOTÃO PRINCIPAL
        ===================================================== */

        .btn-submit {
            width:
                100%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary) 0%,
                    var(--primary-dark) 100%
                );

            color:
                white;

            border:
                none;

            padding:
                16px;

            border-radius:
                var(--radius);

            font-size:
                1rem;

            font-weight:
                800;

            letter-spacing:
                0.02em;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                10px;

            cursor:
                pointer;

            box-shadow:
                0 8px 25px
                var(--accent-glow);

            transition:
                all 0.25s ease;

            margin-top:
                2px;
        }


        .btn-submit:active {
            transform:
                scale(0.98);
        }


        .btn-submit:disabled {
            opacity:
                0.7;

            cursor:
                not-allowed;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer-note {
            text-align:
                center;

            font-size:
                0.72rem;

            color:
                var(--text-sub);

            margin-top:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;
        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 380px) {

            .input-wrapper-paste {
                flex-direction:
                    column;
            }

            .btn-colar {
                width:
                    100%;
            }

            .brand-title h1 {
                font-size:
                    1.08rem;
            }

        }

    </style>
</head>


<body>

    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="brand-header">

        <div class="brand-avatar">
            🦊
        </div>

        <div class="brand-title">

            <h1>
                Raposa Caçadora VIP
            </h1>

            <p>
                <span class="status-badge"></span>
                Sistema de Postagens Conectado
            </p>

        </div>

    </div>


    <!-- =====================================================
         PAINEL
    ===================================================== -->

    <div class="card">

        <div class="card-title">

            <i class="fa-solid fa-sliders"></i>

            Painel de Automação

        </div>


        <!-- =================================================
             LINK
        ================================================= -->

        <div class="field-group">

            <label>

                <i class="fa-solid fa-link"></i>

                Link da Vitrine ou Produto

            </label>


            <div class="input-wrapper-paste">

                <div class="input-wrapper">

                    <i class="fa-solid fa-store"></i>

                    <input
                        type="text"
                        id="linkVitrine"
                        placeholder="Cole o link meli.la ou produto..."
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >

                </div>


                <button
                    class="btn-colar"
                    type="button"
                    onclick="colarLink()"
                >

                    <i class="fa-solid fa-paste"></i>

                    Colar

                </button>

            </div>


            <div class="info-box">

                <i class="fa-solid fa-circle-info"></i>

                Você pode enviar um link de <b>vitrine</b>
                ou um <b>produto individual</b>.
                O servidor fará a pesquisa e publicará
                as ofertas no canal.

            </div>

        </div>


        <!-- =================================================
             INTERVALO
        ================================================= -->

        <div class="field-group">

            <label>

                <i class="fa-solid fa-clock"></i>

                Tempo Entre Postagens

            </label>


            <div class="input-wrapper">

                <i class="fa-solid fa-stopwatch"></i>

                <select id="intervalo">

                    <option value="10">
                        10 Segundos (Teste)
                    </option>

                    <option value="30">
                        30 Segundos
                    </option>

                    <option value="60">
                        1 Minuto
                    </option>

                    <option value="300" selected>
                        5 Minutos (Recomendado)
                    </option>

                    <option value="1800">
                        30 Minutos
                    </option>

                    <option value="3600">
                        1 Hora
                    </option>

                </select>

            </div>


            <div class="time-grid">

                <button
                    type="button"
                    class="time-btn"
                    onclick="setTempo(10, this)"
                >
                    10 seg
                </button>


                <button
                    type="button"
                    class="time-btn"
                    onclick="setTempo(60, this)"
                >
                    1 min
                </button>


                <button
                    type="button"
                    class="time-btn active"
                    onclick="setTempo(300, this)"
                >
                    5 min
                </button>

            </div>

        </div>


        <!-- =================================================
             QUANTIDADE
        ================================================= -->

        <div class="field-group">

            <label>

                <i class="fa-solid fa-layer-group"></i>

                Quantidade de Produtos

            </label>


            <div class="input-wrapper">

                <i class="fa-solid fa-hashtag"></i>

                <input
                    type="number"
                    id="quantidade"
                    value="5"
                    min="1"
                    max="50"
                    inputmode="numeric"
                >

            </div>

        </div>

    </div>


    <!-- =====================================================
         MENSAGEM
    ===================================================== -->

    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <!-- =====================================================
         BOTÃO
    ===================================================== -->

    <button
        class="btn-submit"
        id="btnSubmit"
        type="button"
        onclick="enviarConfiguracao()"
    >

        <i class="fa-solid fa-rocket"></i>

        INICIAR POSTAGENS AUTO

    </button>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <div class="footer-note">

        <i class="fa-solid fa-shield-halved"></i>

        Integração Oficial Telegram WebApp

    </div>


    <script>

        /* ==================================================
           TELEGRAM WEB APP
        ================================================== */

        const tg =
            window.Telegram &&
            window.Telegram.WebApp
                ? window.Telegram.WebApp
                : null;


        /* ==================================================
           INICIALIZAÇÃO
        ================================================== */

        if (tg) {

            tg.ready();

            tg.expand();

            if (tg.setHeaderColor) {

                tg.setHeaderColor(
                    "#05070a"
                );

            }

            if (tg.setBackgroundColor) {

                tg.setBackgroundColor(
                    "#05070a"
                );

            }

        }


        /* ==================================================
           MOSTRAR MENSAGEM
        ================================================== */

        function mostrarMensagem(
            texto,
            tipo
        ) {

            const elemento =
                document.getElementById(
                    "mensagem"
                );


            elemento.className =
                "mensagem " + tipo;


            elemento.innerHTML =
                texto;


            try {

                elemento.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            } catch (e) {}

        }


        /* ==================================================
           ESCAPAR HTML
        ================================================== */

        function escaparHtml(
            texto
        ) {

            return String(texto)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==================================================
           COLAR LINK
        ================================================== */

        async function colarLink() {

            const input =
                document.getElementById(
                    "linkVitrine"
                );


            try {

                if (
                    navigator.clipboard &&
                    navigator.clipboard.readText
                ) {

                    const texto =
                        await navigator
                            .clipboard
                            .readText();


                    if (texto) {

                        input.value =
                            texto.trim();


                        mostrarMensagem(
                            "✅ Link colado com sucesso.",
                            "sucesso"
                        );


                        if (
                            tg &&
                            tg.HapticFeedback
                        ) {

                            tg.HapticFeedback
                                .notificationOccurred(
                                    "success"
                                );

                        }


                        return;

                    }

                }

            } catch (erro) {

                console.warn(
                    "Clipboard bloqueado:",
                    erro
                );

            }


            input.focus();


            mostrarMensagem(
                "📋 Toque e segure no campo para colar o link.",
                "info"
            );


            if (
                tg &&
                tg.showAlert
            ) {

                tg.showAlert(
                    "Toque e segure no campo para colar o link."
                );

            }

        }


        /* ==================================================
           TEMPO RÁPIDO
        ================================================== */

        function setTempo(
            segundos,
            elemento
        ) {

            document.getElementById(
                "intervalo"
            ).value =
                segundos;


            document
                .querySelectorAll(
                    ".time-btn"
                )
                .forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


            elemento.classList.add(
                "active"
            );

        }


        /* ==================================================
           ATUALIZA BOTÕES DE TEMPO
        ================================================== */

        document
            .getElementById(
                "intervalo"
            )
            .addEventListener(
                "change",
                function() {

                    const valor =
                        parseInt(
                            this.value,
                            10
                        );


                    document
                        .querySelectorAll(
                            ".time-btn"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    const botoes =
                        document.querySelectorAll(
                            ".time-btn"
                        );


                    if (valor === 10) {

                        botoes[0]
                            .classList
                            .add("active");

                    }

                    else if (valor === 60) {

                        botoes[1]
                            .classList
                            .add("active");

                    }

                    else if (valor === 300) {

                        botoes[2]
                            .classList
                            .add("active");

                    }

                }
            );


        /* ==================================================
           VALIDAR LINK
        ================================================== */

        function validarLink(
            link
        ) {

            if (!link) {

                return false;

            }


            if (
                !/^https?:\/\//i.test(
                    link
                )
            ) {

                return false;

            }


            return true;

        }


        /* ==================================================
           ENVIAR CONFIGURAÇÃO
        ================================================== */

        async function enviarConfiguracao() {

            const btn =
                document.getElementById(
                    "btnSubmit"
                );


            const inputLink =
                document.getElementById(
                    "linkVitrine"
                );


            const inputIntervalo =
                document.getElementById(
                    "intervalo"
                );


            const inputQuantidade =
                document.getElementById(
                    "quantidade"
                );


            const link =
                inputLink.value.trim();


            const intervalo =
                parseInt(
                    inputIntervalo.value,
                    10
                );


            const quantidade =
                parseInt(
                    inputQuantidade.value,
                    10
                );


            /* ==============================================
               VALIDAR LINK
            ============================================== */

            if (!link) {

                mostrarMensagem(
                    "⚠️ Cole o link da vitrine ou do produto antes de iniciar.",
                    "erro"
                );


                if (
                    tg &&
                    tg.showAlert
                ) {

                    tg.showAlert(
                        "Cole o link da vitrine ou do produto."
                    );

                }


                return;

            }


            if (
                !validarLink(
                    link
                )
            ) {

                mostrarMensagem(
                    "⚠️ O link precisa começar com http:// ou https://",
                    "erro"
                );


                return;

            }


            /* ==============================================
               VALIDAR QUANTIDADE
            ============================================== */

            if (
                !Number.isInteger(
                    quantidade
                ) ||
                quantidade < 1 ||
                quantidade > 50
            ) {

                mostrarMensagem(
                    "⚠️ A quantidade deve estar entre 1 e 50.",
                    "erro"
                );


                return;

            }


            /* ==============================================
               VALIDAR INTERVALO
            ============================================== */

            if (
                !Number.isInteger(
                    intervalo
                ) ||
                intervalo < 10
            ) {

                mostrarMensagem(
                    "⚠️ O intervalo mínimo é de 10 segundos.",
                    "erro"
                );


                return;

            }


            /* ==============================================
               VALIDAR TELEGRAM
            ============================================== */

            if (!tg) {

                mostrarMensagem(
                    "❌ Este painel precisa ser aberto dentro do Telegram.",
                    "erro"
                );


                return;

            }


            /* ==============================================
               INIT DATA
            ============================================== */

            const initData =
                tg.initData || "";


            if (!initData) {

                mostrarMensagem(
                    "❌ Não foi possível obter a autenticação do Telegram.",
                    "erro"
                );


                if (
                    tg.showAlert
                ) {

                    tg.showAlert(
                        "Abra o painel pelo Telegram para continuar."
                    );

                }


                return;

            }


            /* ==============================================
               FEEDBACK
            ============================================== */

            if (
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .impactOccurred(
                        "medium"
                    );

            }


            /* ==============================================
               LOADING
            ============================================== */

            btn.disabled =
                true;


            btn.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';


            mostrarMensagem(
                "⏳ Enviando configuração para o servidor...",
                "info"
            );


            /* ==============================================
               PAYLOAD
            ============================================== */

            const payload = {

                link:
                    link,

                intervalo:
                    intervalo,

                quantidade:
                    quantidade,

                initData:
                    initData

            };


            console.log(
                "📤 Enviando para:",
                window.location.origin +
                "/api/configurar"
            );


            console.log(
                "📦 Payload:",
                {
                    link:
                        link,

                    intervalo:
                        intervalo,

                    quantidade:
                        quantidade,

                    initData:
                        initData
                        ? "PRESENTE"
                        : "AUSENTE"
                }
            );


            /* ==============================================
               REQUISIÇÃO
               
               IMPORTANTE:
               A ROTA CORRETA É /api/configurar
               
               E O MÉTODO É POST.
            ============================================== */

            try {

                const endpoint =
                    "/api/configurar";


                const resposta =
                    await fetch(
                        endpoint,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    payload
                                )

                        }
                    );


                /* ==========================================
                   LER RESPOSTA
                ========================================== */

                const texto =
                    await resposta.text();


                console.log(
                    "📥 HTTP:",
                    resposta.status
                );


                console.log(
                    "📥 Resposta:",
                    texto
                );


                let resultado =
                    null;


                if (
                    texto &&
                    texto.trim()
                ) {

                    try {

                        resultado =
                            JSON.parse(
                                texto
                            );

                    } catch (
                        erroJson
                    ) {

                        console.error(
                            "❌ Resposta não é JSON:",
                            texto
                        );


                        throw new Error(
                            "O servidor retornou uma resposta inválida. HTTP " +
                            resposta.status +
                            ". Resposta: " +
                            texto.substring(
                                0,
                                300
                            )
                        );

                    }

                }


                /* ==========================================
                   HTTP ERROR
                ========================================== */

                if (
                    !resposta.ok
                ) {

                    let mensagemErro =
                        "Erro HTTP " +
                        resposta.status;


                    if (
                        resultado &&
                        resultado.erro
                    ) {

                        mensagemErro =
                            resultado.erro;

                    }

                    else if (
                        resultado &&
                        resultado.error
                    ) {

                        if (
                            typeof resultado.error === "string"
                        ) {

                            mensagemErro =
                                resultado.error;

                        }

                        else if (
                            resultado.error.message
                        ) {

                            mensagemErro =
                                resultado.error.message;

                        }

                    }


                    throw new Error(
                        mensagemErro +
                        " HTTP " +
                        resposta.status
                    );

                }


                /* ==========================================
                   RESPOSTA JSON INVÁLIDA
                ========================================== */

                if (
                    !resultado ||
                    typeof resultado !== "object"
                ) {

                    throw new Error(
                        "O servidor não retornou JSON válido. HTTP " +
                        resposta.status
                    );

                }


                /* ==========================================
                   API RETORNOU ERRO
                ========================================== */

                if (
                    resultado.ok !== true
                ) {

                    throw new Error(
                        resultado.erro ||
                        resultado.mensagem ||
                        "Não foi possível iniciar as postagens."
                    );

                }


                /* ==========================================
                   SUCESSO
                ========================================== */

                console.log(
                    "✅ Automação iniciada:",
                    resultado
                );


                mostrarMensagem(
                    "🚀 <b>Postagens iniciadas!</b><br><br>" +
                    "O servidor recebeu sua solicitação " +
                    "e está processando os produtos.",
                    "sucesso"
                );


                if (
                    tg &&
                    tg.HapticFeedback
                ) {

                    tg.HapticFeedback
                        .notificationOccurred(
                            "success"
                        );

                }


                if (
                    tg &&
                    tg.showAlert
                ) {

                    tg.showAlert(
                        "✅ Automação iniciada com sucesso!"
                    );

                }


                btn.innerHTML =
                    '<i class="fa-solid fa-check"></i> POSTAGENS INICIADAS';


                /* ==========================================
                   FECHAR MINI APP
                   
                   Não fecha imediatamente para permitir
                   visualizar a confirmação.
                ========================================== */

                setTimeout(
                    function() {

                        if (
                            tg &&
                            typeof tg.close === "function"
                        ) {

                            tg.close();

                        }

                    },
                    2500
                );

            }


            /* ==============================================
               ERRO
            ============================================== */

            catch (
                erro
            ) {

                console.error(
                    "❌ Erro ao enviar:",
                    erro
                );


                const mensagemErro =
                    erro &&
                    erro.message
                        ? erro.message
                        : "Erro desconhecido ao comunicar com o servidor.";


                mostrarMensagem(
                    "❌ <b>Erro:</b><br>" +
                    escaparHtml(
                        mensagemErro
                    ),
                    "erro"
                );


                if (
                    tg &&
                    tg.HapticFeedback
                ) {

                    tg.HapticFeedback
                        .notificationOccurred(
                            "error"
                        );

                }


                if (
                    tg &&
                    tg.showAlert
                ) {

                    tg.showAlert(
                        "❌ " +
                        mensagemErro
                    );

                }


                btn.disabled =
                    false;


                btn.innerHTML =
                    '<i class="fa-solid fa-rocket"></i> INICIAR POSTAGENS AUTO';

            }

        }


        /* ==================================================
           ENTER NO CAMPO
        ================================================== */

        document
            .getElementById(
                "linkVitrine"
            )
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        enviarConfiguracao();

                    }

                }
            );


        /* ==================================================
           LOG INICIAL
        ================================================== */

        console.log(
            "🦊 Raposa Caçadora Mini App carregado."
        );


        console.log(
            "🌐 Origem:",
            window.location.origin
        );


        console.log(
            "📡 Endpoint da API:",
            window.location.origin +
            "/api/configurar"
        );


        console.log(
            "📱 Telegram:",
            tg
                ? "Detectado"
                : "Não detectado"
        );

    </script>

</body>

</html>

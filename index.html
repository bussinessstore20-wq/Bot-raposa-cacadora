<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Raposa Caçadora - Painel VIP</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        :root {
            --bg: #05070a;
            --card: rgba(15, 23, 36, .92);
            --border: rgba(255,255,255,.09);
            --orange: #f97316;
            --orange2: #ea580c;
            --text: #f8fafc;
            --sub: #94a3b8;
            --input: rgba(6,10,17,.95);
            --green: #22c55e;
            --red: #ef4444;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            padding: 20px 16px 30px;
            color: var(--text);
            background:
                linear-gradient(
                    135deg,
                    #05070a 0%,
                    #0d111a 100%
                );
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080b11;
            border: 2px solid var(--orange);
            font-size: 28px;
            box-shadow: 0 0 25px rgba(249,115,22,.45);
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .brand p {
            margin-top: 3px;
            color: var(--sub);
            font-size: .8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .card {
            padding: 20px;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,.45);
        }

        .title {
            color: #fdba74;
            font-size: .9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px;
            color: var(--sub);
            font-size: .82rem;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-box {
            position: relative;
            flex: 1;
        }

        .input-box > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
        }

        input,
        select {
            width: 100%;
            min-height: 48px;
            padding: 13px 14px 13px 42px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.12);
            outline: none;
            background: var(--input);
            color: var(--text);
            font-size: .92rem;
        }

        input:focus,
        select:focus {
            border-color: var(--orange);
            box-shadow:
                0 0 0 3px rgba(249,115,22,.15);
        }

        select option {
            background: #0f172a;
            color: white;
        }

        .paste {
            min-height: 48px;
            padding: 0 15px;
            border-radius: 12px;
            border: 1px solid var(--orange);
            background: rgba(249,115,22,.13);
            color: #fdba74;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .paste:active {
            transform: scale(.97);
        }

        .quick {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .quick button {
            padding: 10px 5px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            background: var(--input);
            color: var(--sub);
            font-weight: 700;
            cursor: pointer;
        }

        .quick button.active {
            color: var(--orange);
            border-color: var(--orange);
            background: rgba(249,115,22,.15);
        }

        .submit {
            width: 100%;
            min-height: 54px;
            margin-top: 18px;
            border: 0;
            border-radius: var(--radius);
            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange2)
                );
            color: white;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow:
                0 8px 25px rgba(249,115,22,.35);
        }

        .submit:active {
            transform: scale(.985);
        }

        .submit:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            line-height: 1.45;
            font-size: .86rem;
        }

        .message.show {
            display: block;
        }

        .message.success {
            color: #86efac;
            background: rgba(34,197,94,.1);
            border: 1px solid rgba(34,197,94,.25);
        }

        .message.error {
            color: #fca5a5;
            background: rgba(239,68,68,.1);
            border: 1px solid rgba(239,68,68,.25);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: var(--sub);
            font-size: .72rem;
        }

        .debug {
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0,0,0,.25);
            color: #64748b;
            font-size: .68rem;
            word-break: break-all;
            display: none;
        }

        @media (max-width: 390px) {
            .input-row {
                flex-direction: column;
            }

            .paste {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <div class="avatar">🦊</div>

        <div>
            <h1>Raposa Caçadora VIP</h1>

            <p>
                <span class="status"></span>
                Sistema de Postagens Conectado
            </p>
        </div>
    </div>

    <div class="card">

        <div class="title">
            <i class="fa-solid fa-sliders"></i>
            Painel de Automação
        </div>

        <!-- LINK -->
        <div class="field">

            <label>
                <i class="fa-solid fa-link"></i>
                Link da Vitrine ou Produto
            </label>

            <div class="input-row">

                <div class="input-box">

                    <i class="fa-solid fa-store"></i>

                    <input
                        id="linkVitrine"
                        type="url"
                        inputmode="url"
                        placeholder="Cole o link da vitrine..."
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >

                </div>

                <button
                    class="paste"
                    id="btnColar"
                    type="button"
                >
                    <i class="fa-solid fa-paste"></i>
                    Colar
                </button>

            </div>

        </div>

        <!-- INTERVALO -->
        <div class="field">

            <label>
                <i class="fa-solid fa-clock"></i>
                Tempo entre postagens
            </label>

            <div class="input-box">

                <i class="fa-solid fa-stopwatch"></i>

                <select id="intervalo">

                    <option value="10">
                        10 segundos - Teste
                    </option>

                    <option value="30">
                        30 segundos
                    </option>

                    <option value="60">
                        1 minuto
                    </option>

                    <option value="300" selected>
                        5 minutos - Recomendado
                    </option>

                    <option value="1800">
                        30 minutos
                    </option>

                    <option value="3600">
                        1 hora
                    </option>

                </select>

            </div>

            <div class="quick">

                <button type="button" data-time="10">
                    10 seg
                </button>

                <button type="button" data-time="60">
                    1 min
                </button>

                <button
                    type="button"
                    data-time="300"
                    class="active"
                >
                    5 min
                </button>

            </div>

        </div>

        <!-- QUANTIDADE -->
        <div class="field">

            <label>
                <i class="fa-solid fa-layer-group"></i>
                Quantidade de produtos
            </label>

            <div class="input-box">

                <i class="fa-solid fa-hashtag"></i>

                <input
                    id="quantidade"
                    type="number"
                    value="5"
                    min="1"
                    max="50"
                    inputmode="numeric"
                >

            </div>

        </div>

        <button
            class="submit"
            id="btnSubmit"
            type="button"
        >
            <i class="fa-solid fa-rocket"></i>
            INICIAR POSTAGENS AUTO
        </button>

        <div
            id="mensagem"
            class="message"
        ></div>

        <div
            id="debug"
            class="debug"
        ></div>

    </div>

    <div class="footer">
        <i class="fa-solid fa-shield-halved"></i>
        Integração Oficial Telegram WebApp
    </div>

</div>


<script>

    /*
    ============================================================
    TELEGRAM WEB APP
    ============================================================
    */

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;


    if (tg) {

        try {
            tg.ready();
            tg.expand();

            if (tg.setHeaderColor) {
                tg.setHeaderColor("#05070a");
            }

            if (tg.setBackgroundColor) {
                tg.setBackgroundColor("#05070a");
            }
        } catch (e) {
            console.warn("Telegram WebApp:", e);
        }

    }


    /*
    ============================================================
    ELEMENTOS
    ============================================================
    */

    const inputLink =
        document.getElementById("linkVitrine");

    const inputQuantidade =
        document.getElementById("quantidade");

    const selectIntervalo =
        document.getElementById("intervalo");

    const btnSubmit =
        document.getElementById("btnSubmit");

    const btnColar =
        document.getElementById("btnColar");

    const mensagem =
        document.getElementById("mensagem");

    const debug =
        document.getElementById("debug");


    /*
    ============================================================
    MENSAGEM
    ============================================================
    */

    function mostrarMensagem(texto, tipo) {

        mensagem.className =
            "message show " + tipo;

        mensagem.innerHTML =
            texto;

    }


    function limparMensagem() {

        mensagem.className =
            "message";

        mensagem.innerHTML =
            "";

    }


    /*
    ============================================================
    HAPTIC
    ============================================================
    */

    function vibrar(tipo) {

        try {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                if (tipo === "success") {

                    tg.HapticFeedback
                        .notificationOccurred("success");

                } else if (tipo === "error") {

                    tg.HapticFeedback
                        .notificationOccurred("error");

                } else {

                    tg.HapticFeedback
                        .impactOccurred("medium");

                }

            }

        } catch (e) {}

    }


    /*
    ============================================================
    COLAR
    ============================================================
    */

    btnColar.addEventListener(
        "click",
        async function() {

            try {

                if (
                    navigator.clipboard &&
                    navigator.clipboard.readText
                ) {

                    const texto =
                        await navigator.clipboard.readText();

                    if (texto) {

                        inputLink.value =
                            texto.trim();

                        vibrar("success");

                        return;

                    }

                }

            } catch (erro) {

                console.warn(
                    "Clipboard:",
                    erro
                );

            }

            inputLink.focus();

            if (
                tg &&
                tg.showAlert
            ) {

                tg.showAlert(
                    "Toque e segure no campo para colar o link."
                );

            }

        }
    );


    /*
    ============================================================
    BOTÕES DE TEMPO
    ============================================================
    */

    document
        .querySelectorAll(".quick button")
        .forEach(function(botao) {

            botao.addEventListener(
                "click",
                function() {

                    const valor =
                        parseInt(
                            this.dataset.time,
                            10
                        );

                    selectIntervalo.value =
                        valor;

                    document
                        .querySelectorAll(
                            ".quick button"
                        )
                        .forEach(
                            function(b) {
                                b.classList.remove(
                                    "active"
                                );
                            }
                        );

                    this.classList.add(
                        "active"
                    );

                }
            );

        });


    selectIntervalo.addEventListener(
        "change",
        function() {

            const valor =
                parseInt(
                    this.value,
                    10
                );

            document
                .querySelectorAll(
                    ".quick button"
                )
                .forEach(
                    function(b) {
                        b.classList.remove(
                            "active"
                        );
                    }
                );

            document
                .querySelectorAll(
                    ".quick button"
                )
                .forEach(
                    function(b) {

                        if (
                            parseInt(
                                b.dataset.time,
                                10
                            ) === valor
                        ) {

                            b.classList.add(
                                "active"
                            );

                        }

                    }
                );

        }
    );


    /*
    ============================================================
    VALIDAR URL
    ============================================================
    */

    function validarLink(link) {

        try {

            const url =
                new URL(link);

            return (
                url.protocol === "http:" ||
                url.protocol === "https:"
            );

        } catch (e) {

            return false;

        }

    }


    /*
    ============================================================
    OBTER INIT DATA
    ============================================================
    */

    function obterInitData() {

        if (!tg) {
            return "";
        }

        return (
            tg.initData ||
            ""
        );

    }


    /*
    ============================================================
    ENVIO PRINCIPAL
    ============================================================
    */

    async function enviarConfiguracao() {

        limparMensagem();

        debug.style.display =
            "none";

        const link =
            inputLink.value.trim();

        const intervalo =
            parseInt(
                selectIntervalo.value,
                10
            );

        const quantidade =
            parseInt(
                inputQuantidade.value,
                10
            );


        /*
        --------------------------------------------------------
        LINK
        --------------------------------------------------------
        */

        if (!link) {

            mostrarMensagem(
                "⚠️ Cole o link da vitrine ou do produto.",
                "error"
            );

            vibrar("error");

            return;

        }


        if (!validarLink(link)) {

            mostrarMensagem(
                "⚠️ Informe um link válido começando com https://",
                "error"
            );

            vibrar("error");

            return;

        }


        /*
        --------------------------------------------------------
        QUANTIDADE
        --------------------------------------------------------
        */

        if (
            !Number.isInteger(quantidade) ||
            quantidade < 1 ||
            quantidade > 50
        ) {

            mostrarMensagem(
                "⚠️ A quantidade deve estar entre 1 e 50.",
                "error"
            );

            vibrar("error");

            return;

        }


        /*
        --------------------------------------------------------
        TELEGRAM
        --------------------------------------------------------
        */

        if (!tg) {

            mostrarMensagem(
                "❌ Abra este painel dentro do Telegram.",
                "error"
            );

            vibrar("error");

            return;

        }


        /*
        --------------------------------------------------------
        INIT DATA
        --------------------------------------------------------
        */

        const initData =
            obterInitData();

        if (!initData) {

            mostrarMensagem(
                "❌ Não foi possível obter a autenticação do Telegram. Abra o painel pelo botão do bot.",
                "error"
            );

            try {

                if (tg.showAlert) {

                    tg.showAlert(
                        "Abra o painel pelo botão do bot no Telegram."
                    );

                }

            } catch (e) {}

            vibrar("error");

            return;

        }


        /*
        --------------------------------------------------------
        IMPORTANTE:
        USA A ORIGEM DA PRÓPRIA PÁGINA.
        NÃO USA /configurar.
        NÃO USA URL FIXA.
        --------------------------------------------------------
        */

        const endpoint =
            window.location.origin +
            "/api/configurar";


        /*
        --------------------------------------------------------
        PAYLOAD
        --------------------------------------------------------
        */

        const payload = {

            link: link,

            intervalo: intervalo,

            quantidade: quantidade,

            initData: initData

        };


        /*
        --------------------------------------------------------
        DEBUG
        --------------------------------------------------------
        */

        console.log(
            "================================"
        );

        console.log(
            "RAPOSA CAÇADORA"
        );

        console.log(
            "Endpoint:",
            endpoint
        );

        console.log(
            "Método: POST"
        );

        console.log(
            "Payload:",
            {
                link: link,
                intervalo: intervalo,
                quantidade: quantidade,
                initData:
                    initData
                        ? "PRESENTE"
                        : "AUSENTE"
            }
        );

        console.log(
            "================================"
        );


        /*
        --------------------------------------------------------
        BOTÃO
        --------------------------------------------------------
        */

        btnSubmit.disabled =
            true;

        btnSubmit.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';

        mostrarMensagem(
            "⏳ Enviando configuração para o servidor...",
            "success"
        );

        vibrar("medium");


        try {

            /*
            ====================================================
            POST
            ====================================================
            */

            const resposta =
                await fetch(
                    endpoint,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            /*
            ====================================================
            LER RESPOSTA
            ====================================================
            */

            const texto =
                await resposta.text();


            console.log(
                "HTTP:",
                resposta.status
            );

            console.log(
                "Resposta:",
                texto
            );


            /*
            ====================================================
            TENTAR JSON
            ====================================================
            */

            let resultado = null;

            try {

                resultado =
                    texto
                        ? JSON.parse(texto)
                        : null;

            } catch (erroJson) {

                console.error(
                    "Resposta não é JSON:",
                    erroJson
                );

            }


            /*
            ====================================================
            HTTP ERROR
            ====================================================
            */

            if (!resposta.ok) {

                let erroServidor =
                    "Erro HTTP " +
                    resposta.status;

                if (
                    resultado &&
                    resultado.erro
                ) {

                    erroServidor =
                        resultado.erro;

                }

                /*
                Se o servidor devolveu HTML,
                mostramos somente o HTTP.
                */

                if (
                    !resultado &&
                    texto &&
                    texto.length < 500
                ) {

                    erroServidor +=
                        "\n" + texto;

                }

                throw new Error(
                    erroServidor
                );

            }


            /*
            ====================================================
            RESPOSTA SEM JSON
            ====================================================
            */

            if (!resultado) {

                throw new Error(
                    "O servidor respondeu, mas não enviou JSON válido."
                );

            }


            /*
            ====================================================
            ERRO DA API
            ====================================================
            */

            if (
                resultado.ok !== true
            ) {

                throw new Error(
                    resultado.erro ||
                    resultado.mensagem ||
                    "Não foi possível iniciar as postagens."
                );

            }


            /*
            ====================================================
            SUCESSO
            ====================================================
            */

            console.log(
                "✅ Automação iniciada:",
                resultado
            );


            mostrarMensagem(
                "🚀 <b>Postagens iniciadas!</b><br><br>" +
                "O servidor recebeu sua vitrine e iniciou o processamento.",
                "success"
            );


            vibrar("success");


            btnSubmit.innerHTML =
                '<i class="fa-solid fa-check"></i> POSTAGENS INICIADAS';


            /*
            ====================================================
            ALERTA TELEGRAM
            ====================================================
            */

            try {

                if (tg.showAlert) {

                    tg.showAlert(
                        "✅ Automação iniciada com sucesso!"
                    );

                }

            } catch (e) {}


            /*
            ====================================================
            FECHAR MINI APP
            ====================================================
            */

            setTimeout(
                function() {

                    try {

                        if (
                            tg &&
                            tg.close
                        ) {

                            tg.close();

                        }

                    } catch (e) {}

                },
                1800
            );


        } catch (erro) {

            console.error(
                "❌ ERRO FINAL:",
                erro
            );


            const erroTexto =
                erro &&
                erro.message
                    ? erro.message
                    : "Erro desconhecido.";


            mostrarMensagem(
                "❌ <b>Erro:</b><br>" +
                escapeHtml(
                    erroTexto
                ),
                "error"
            );


            /*
            ----------------------------------------------------
            MOSTRA ENDPOINT PARA DIAGNÓSTICO
            ----------------------------------------------------
            */

            debug.innerHTML =
                "Endpoint utilizado:<br>" +
                escapeHtml(endpoint);

            debug.style.display =
                "block";


            vibrar("error");


            try {

                if (tg.showAlert) {

                    tg.showAlert(
                        "❌ " + erroTexto
                    );

                }

            } catch (e) {}


            btnSubmit.disabled =
                false;

            btnSubmit.innerHTML =
                '<i class="fa-solid fa-rocket"></i> INICIAR POSTAGENS AUTO';

        }

    }


    /*
    ============================================================
    ESCAPAR HTML
    ============================================================
    */

    function escapeHtml(texto) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            texto;

        return div.innerHTML;

    }


    /*
    ============================================================
    CLIQUE NO BOTÃO
    ============================================================
    */

    btnSubmit.addEventListener(
        "click",
        enviarConfiguracao
    );


    /*
    ============================================================
    ENTER NO CAMPO DO LINK
    ============================================================
    */

    inputLink.addEventListener(
        "keydown",
        function(evento) {

            if (
                evento.key === "Enter"
            ) {

                evento.preventDefault();

                enviarConfiguracao();

            }

        }
    );


    /*
    ============================================================
    INFORMAÇÃO DE DIAGNÓSTICO NO CONSOLE
    ============================================================
    */

    console.log(
        "🦊 Raposa Caçadora carregada."
    );

    console.log(
        "Página:",
        window.location.href
    );

    console.log(
        "Servidor:",
        window.location.origin
    );

    console.log(
        "API:",
        window.location.origin +
        "/api/configurar"
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Raposa Caçadora</title>
  <!-- SDK do Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1c1c1e;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2c2c2e;
      color: #fff;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: #ff6b00;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    #mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      word-break: break-word;
    }
    .msg-sucesso {
      background-color: rgba(46, 204, 113, 0.2);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }
    .msg-erro {
      background-color: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Configurar Bot Raposa</h2>

    <div class="form-group">
      <label for="linkCanal">Link do Canal / Grupo:</label>
      <input type="text" id="linkCanal" placeholder="https://t.me/seucanal">
    </div>

    <div class="form-group">
      <label for="intervalo">Intervalo (Minutos):</label>
      <input type="number" id="intervalo" value="30" min="1">
    </div>

    <button id="btn-iniciar" onclick="enviarConfiguracao()">
      <i class="fa-solid fa-rocket"></i> INICIAR POSTAGENS AUTO
    </button>

    <div id="mensagem"></div>
  </div>

  <script>
    // Inicializa o Telegram Web App se disponível
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    function mostrarMensagem(texto, tipo) {
      const msgBox = document.getElementById("mensagem");
      msgBox.style.display = "block";
      msgBox.className = tipo === "sucesso" ? "msg-sucesso" : "msg-erro";
      msgBox.innerText = texto;
    }

    async function enviarConfiguracao() {
      const btn = document.getElementById("btn-iniciar");
      const linkCanal = document.getElementById("linkCanal").value;
      const intervalo = document.getElementById("intervalo").value;

      // Desabilita o botão durante o envio
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';

      const dadosParaEnviar = {
        initData: tg ? tg.initData : "",
        linkCanal: linkCanal,
        intervalo: intervalo
      };

      try {
        const resposta = await fetch("https://bot-raposa-cacadora.onrender.com/api/configurar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dadosParaEnviar)
        });

        // Converte a resposta em JSON com tratamento contra falhas
        const resultado = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
          // Garante extração da mensagem sem virar [object Object]
          let mensagemErro = `Erro HTTP ${resposta.status}`;

          if (resultado) {
            if (typeof resultado.erro === "string") mensagemErro = resultado.erro;
            else if (typeof resultado.error === "string") mensagemErro = resultado.error;
            else if (typeof resultado.mensagem === "string") mensagemErro = resultado.mensagem;
          }

          mostrarMensagem("❌ " + mensagemErro, "erro");
          return;
        }

        // Sucesso
        mostrarMensagem("✅ " + (resultado.mensagem || "Configuração salva com sucesso!"), "sucesso");

      } catch (err) {
        // Captura exceções de rede/CORS diretamente
        console.error("Erro na requisição:", err);
        mostrarMensagem("❌ Falha de conexão. O servidor no Render pode estar hibernando ou inacessível no momento.", "erro");
      } finally {
        // Reativa o botão após o encerramento
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-rocket"></i> INICIAR POSTAGENS AUTO';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Raposa Caçadora - Painel VIP</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>

    :root {
      --bg: #05070a;
      --card: rgba(15, 23, 36, .88);
      --border: rgba(255,255,255,.08);
      --orange: #f97316;
      --orange2: #ea580c;
      --text: #f8fafc;
      --sub: #94a3b8;
      --input: rgba(6,10,17,.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      padding: 20px 16px 30px;
      background:
        linear-gradient(
          135deg,
          #05070a 0%,
          #0d111a 100%
        );
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b11;
      border: 2px solid var(--orange);
      font-size: 29px;
      box-shadow: 0 0 25px rgba(249,115,22,.45);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .status {
      margin-top: 3px;
      color: var(--sub);
      font-size: .8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .card {
      padding: 20px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      backdrop-filter: blur(16px);
    }

    .title {
      color: #fdba74;
      font-size: .9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sub);
      font-size: .82rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-wrap {
      position: relative;
      flex: 1;
    }

    .input-wrap > i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 13px 14px 13px 42px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: var(--input);
      color: white;
      outline: none;
      font-size: .92rem;
    }

    input:focus,
    select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(249,115,22,.18);
    }

    select option {
      background: #0f172a;
      color: white;
    }

    .paste {
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--orange);
      background: rgba(249,115,22,.13);
      color: #fdba74;
      padding: 0 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .time-btn {
      padding: 10px 6px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: var(--input);
      color: var(--sub);
      font-weight: 600;
      cursor: pointer;
    }

    .time-btn.active {
      color: var(--orange);
      border-color: var(--orange);
      background: rgba(249,115,22,.16);
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      font-size: .85rem;
      line-height: 1.45;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: #86efac;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.25);
    }

    .message.error {
      color: #fca5a5;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.25);
    }

    .submit {
      width: 100%;
      min-height: 54px;
      margin-top: 16px;
      border: 0;
      border-radius: 16px;
      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--orange2)
        );
      color: white;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(249,115,22,.35);
    }

    .submit:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: var(--sub);
      font-size: .75rem;
    }

    .debug {
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      color: #64748b;
      font-size: .68rem;
      word-break: break-all;
      display: none;
    }

    @media(max-width:380px) {
      .input-row {
        flex-direction: column;
      }

      .paste {
        width: 100%;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <div class="brand">

    <div class="avatar">
      🦊
    </div>

    <div>
      <h1>Raposa Caçadora VIP</h1>

      <div class="status">
        <span class="dot"></span>
        Sistema de Postagens Conectado
      </div>
    </div>

  </div>


  <div class="card">

    <div class="title">
      <i class="fa-solid fa-sliders"></i>
      Painel de Automação
    </div>


    <div class="field">

      <label>
        <i class="fa-solid fa-link"></i>
        Link da Vitrine / Produto
      </label>

      <div class="input-row">

        <div class="input-wrap">

          <i class="fa-solid fa-store"></i>

          <input
            id="linkVitrine"
            type="text"
            placeholder="Cole o link da vitrine ou produto..."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          >

        </div>

        <button
          type="button"
          class="paste"
          onclick="colarLink()"
        >
          <i class="fa-solid fa-paste"></i>
          Colar
        </button>

      </div>

    </div>


    <div class="field">

      <label>
        <i class="fa-solid fa-clock"></i>
        Tempo entre postagens
      </label>

      <div class="input-wrap">

        <i class="fa-solid fa-stopwatch"></i>

        <select id="intervalo">

          <option value="10">
            10 segundos - teste
          </option>

          <option value="30">
            30 segundos
          </option>

          <option value="60">
            1 minuto
          </option>

          <option value="300" selected>
            5 minutos - recomendado
          </option>

          <option value="1800">
            30 minutos
          </option>

          <option value="3600">
            1 hora
          </option>

        </select>

      </div>


      <div class="time-grid">

        <button
          type="button"
          class="time-btn"
          onclick="setTempo(10,this)"
        >
          10 seg
        </button>

        <button
          type="button"
          class="time-btn"
          onclick="setTempo(60,this)"
        >
          1 min
        </button>

        <button
          type="button"
          class="time-btn active"
          onclick="setTempo(300,this)"
        >
          5 min
        </button>

      </div>

    </div>


    <div class="field">

      <label>
        <i class="fa-solid fa-layer-group"></i>
        Quantidade de produtos
      </label>

      <div class="input-wrap">

        <i class="fa-solid fa-hashtag"></i>

        <input
          id="quantidade"
          type="number"
          value="5"
          min="1"
          max="50"
          inputmode="numeric"
        >

      </div>

    </div>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <button
    id="submit"
    type="button"
    class="submit"
    onclick="enviarConfiguracao()"
  >
    <i class="fa-solid fa-rocket"></i>
    INICIAR POSTAGENS AUTO
  </button>


  <div id="debug" class="debug"></div>


  <div class="footer">
    <i class="fa-solid fa-shield-halved"></i>
    Integração Oficial Telegram WebApp
  </div>

</div>


<script>

  /*
   * ==========================================================
   * TELEGRAM
   * ==========================================================
   */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  if (tg) {

    tg.ready();

    tg.expand();

    if (tg.setHeaderColor) {
      tg.setHeaderColor("#05070a");
    }

    if (tg.setBackgroundColor) {
      tg.setBackgroundColor("#05070a");
    }

  }


  /*
   * ==========================================================
   * URL DO SERVIDOR
   *
   * IMPORTANTE:
   * NÃO usar domínio fixo.
   *
   * Se o app abriu em:
   *
   * https://bot-raposa-cacadora.onrender.com/app
   *
   * então a API será:
   *
   * https://bot-raposa-cacadora.onrender.com/api/configurar
   *
   * ==========================================================
   */

  const API_URL =
    window.location.origin +
    "/api/configurar";


  /*
   * ==========================================================
   * DEBUG
   * ==========================================================
   */

  function mostrarDebug(texto) {

    const debug =
      document.getElementById("debug");

    debug.style.display = "block";

    debug.textContent =
      "API: " + API_URL +
      "\n" +
      texto;

  }


  /*
   * ==========================================================
   * MENSAGEM
   * ==========================================================
   */

  function mostrarMensagem(
    texto,
    tipo
  ) {

    const elemento =
      document.getElementById("message");

    elemento.className =
      "message show " + tipo;

    elemento.innerHTML =
      texto;

  }


  /*
   * ==========================================================
   * COLAR
   * ==========================================================
   */

  async function colarLink() {

    const input =
      document.getElementById(
        "linkVitrine"
      );

    try {

      if (
        navigator.clipboard &&
        navigator.clipboard.readText
      ) {

        const texto =
          await navigator.clipboard.readText();

        if (texto) {

          input.value =
            texto.trim();

          if (
            tg &&
            tg.HapticFeedback
          ) {

            tg.HapticFeedback
              .notificationOccurred(
                "success"
              );

          }

          return;

        }

      }

    } catch (erro) {

      console.warn(
        "Clipboard bloqueado:",
        erro
      );

    }

    input.focus();

    if (
      tg &&
      tg.showAlert
    ) {

      tg.showAlert(
        "Toque e segure no campo para colar o link."
      );

    }

  }


  /*
   * ==========================================================
   * TEMPO
   * ==========================================================
   */

  function setTempo(
    segundos,
    elemento
  ) {

    document.getElementById(
      "intervalo"
    ).value =
      segundos;

    document
      .querySelectorAll(".time-btn")
      .forEach(
        function(btn) {

          btn.classList.remove(
            "active"
          );

        }
      );

    elemento.classList.add(
      "active"
    );

  }


  /*
   * ==========================================================
   * SINCRONIZAR BOTÕES
   * ==========================================================
   */

  document
    .getElementById("intervalo")
    .addEventListener(
      "change",
      function() {

        const valor =
          parseInt(this.value);

        document
          .querySelectorAll(".time-btn")
          .forEach(
            function(btn) {

              btn.classList.remove(
                "active"
              );

            }
          );

        const botoes =
          document.querySelectorAll(
            ".time-btn"
          );

        if (valor === 10) {
          botoes[0].classList.add("active");
        }

        if (valor === 60) {
          botoes[1].classList.add("active");
        }

        if (valor === 300) {
          botoes[2].classList.add("active");
        }

      }
    );


  /*
   * ==========================================================
   * ENVIAR CONFIGURAÇÃO
   * ==========================================================
   */

  async function enviarConfiguracao() {

    const btn =
      document.getElementById(
        "submit"
      );

    const link =
      document
        .getElementById(
          "linkVitrine"
        )
        .value
        .trim();

    const intervalo =
      parseInt(
        document.getElementById(
          "intervalo"
        ).value
      );

    const quantidade =
      parseInt(
        document.getElementById(
          "quantidade"
        ).value
      );


    /*
     * --------------------------------------------------------
     * VALIDAR LINK
     * --------------------------------------------------------
     */

    if (!link) {

      mostrarMensagem(
        "⚠️ Cole o link da vitrine ou do produto.",
        "error"
      );

      return;

    }


    /*
     * --------------------------------------------------------
     * VALIDAR QUANTIDADE
     * --------------------------------------------------------
     */

    if (
      !Number.isInteger(quantidade) ||
      quantidade < 1 ||
      quantidade > 50
    ) {

      mostrarMensagem(
        "⚠️ A quantidade deve estar entre 1 e 50.",
        "error"
      );

      return;

    }


    /*
     * --------------------------------------------------------
     * VALIDAR TELEGRAM
     * --------------------------------------------------------
     */

    if (!tg) {

      mostrarMensagem(
        "❌ Abra o painel dentro do Telegram.",
        "error"
      );

      return;

    }


    /*
     * --------------------------------------------------------
     * INIT DATA
     * --------------------------------------------------------
     */

    const initData =
      tg.initData || "";


    if (!initData) {

      mostrarMensagem(
        "❌ Não foi possível obter a autenticação do Telegram.",
        "error"
      );

      if (tg.showAlert) {

        tg.showAlert(
          "Abra o Mini App pelo Telegram."
        );

      }

      return;

    }


    /*
     * --------------------------------------------------------
     * LOADING
     * --------------------------------------------------------
     */

    btn.disabled = true;

    btn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';


    mostrarMensagem(
      "⏳ Enviando configuração para o servidor...",
      "success"
    );


    mostrarDebug(
      "Preparando requisição..."
    );


    /*
     * --------------------------------------------------------
     * PAYLOAD
     * --------------------------------------------------------
     */

    const payload = {

      link: link,

      intervalo: intervalo,

      quantidade: quantidade,

      initData: initData

    };


    console.log(
      "================================"
    );

    console.log(
      "API:",
      API_URL
    );

    console.log(
      "PAYLOAD:",
      {
        link: link,
        intervalo: intervalo,
        quantidade: quantidade,
        initData:
          initData
            ? "PRESENTE"
            : "AUSENTE"
      }
    );

    console.log(
      "================================"
    );


    try {

      /*
       * ------------------------------------------------------
       * POST
       * ------------------------------------------------------
       */

      const resposta =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      /*
       * ------------------------------------------------------
       * LER TEXTO
       * ------------------------------------------------------
       */

      const texto =
        await resposta.text();


      console.log(
        "HTTP:",
        resposta.status
      );

      console.log(
        "RESPOSTA:",
        texto
      );


      mostrarDebug(
        "HTTP " +
        resposta.status +
        "\n" +
        texto
      );


      /*
       * ------------------------------------------------------
       * TENTAR JSON
       * ------------------------------------------------------
       */

      let resultado = null;

      try {

        resultado =
          texto
            ? JSON.parse(texto)
            : null;

      } catch (erro) {

        resultado = null;

      }


      /*
       * ------------------------------------------------------
       * ERRO HTTP
       * ------------------------------------------------------
       */

      if (!resposta.ok) {

        let mensagemErro =
          "Erro HTTP " +
          resposta.status;

        if (
          resultado &&
          resultado.erro
        ) {

          mensagemErro =
            resultado.erro;

        }

        else if (texto) {

          mensagemErro =
            texto;

        }

        throw new Error(
          mensagemErro
        );

      }


      /*
       * ------------------------------------------------------
       * RESPOSTA SEM JSON
       * ------------------------------------------------------
       */

      if (!resultado) {

        throw new Error(
          "O servidor não retornou JSON válido."
        );

      }


      /*
       * ------------------------------------------------------
       * API RETORNOU ERRO
       * ------------------------------------------------------
       */

      if (!resultado.ok) {

        throw new Error(
          resultado.erro ||
          resultado.error ||
          "Não foi possível iniciar as postagens."
        );

      }


      /*
       * ------------------------------------------------------
       * SUCESSO
       * ------------------------------------------------------
       */

      mostrarMensagem(
        "🚀 <b>Postagens iniciadas!</b><br><br>" +
        "O servidor recebeu sua vitrine e começou o processamento.",
        "success"
      );


      if (
        tg &&
        tg.HapticFeedback
      ) {

        tg.HapticFeedback
          .notificationOccurred(
            "success"
          );

      }


      if (
        tg &&
        tg.showAlert
      ) {

        tg.showAlert(
          "✅ Automação iniciada com sucesso!"
        );

      }


      btn.innerHTML =
        '<i class="fa-solid fa-check"></i> POSTAGENS INICIADAS';


      /*
       * NÃO FECHAR IMEDIATAMENTE.
       *
       * O usuário pode verificar a mensagem.
       */

      setTimeout(
        function() {

          btn.disabled =
            false;

        },
        3000
      );


    } catch (erro) {

      console.error(
        "❌ ERRO FINAL:",
        erro
      );


      mostrarMensagem(
        "❌ Erro:<br>" +
        escapeHtml(
          erro.message ||
          "Erro desconhecido."
        ),
        "error"
      );


      if (
        tg &&
        tg.HapticFeedback
      ) {

        tg.HapticFeedback
          .notificationOccurred(
            "error"
          );

      }


      if (
        tg &&
        tg.showAlert
      ) {

        tg.showAlert(
          "❌ " +
          (
            erro.message ||
            "Erro ao enviar configuração."
          )
        );

      }


      btn.disabled =
        false;

      btn.innerHTML =
        '<i class="fa-solid fa-rocket"></i> INICIAR POSTAGENS AUTO';

    }

  }


  /*
   * ==========================================================
   * ESCAPAR HTML
   * ==========================================================
   */

  function escapeHtml(texto) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      texto;

    return div.innerHTML;

  }


  /*
   * ==========================================================
   * VERIFICAÇÃO INICIAL
   * ==========================================================
   */

  console.log(
    "🦊 Raposa Caçadora carregada."
  );

  console.log(
    "Página:",
    window.location.href
  );

  console.log(
    "API:",
    API_URL
  );

</script>

</body>
</html>

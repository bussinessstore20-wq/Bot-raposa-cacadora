<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bot Raposa Caçadora</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- FontAwesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background-color: #1c1c1e;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #ff6b00;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2c2c2e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff6b00;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: #ff6b00;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #e85f00;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      word-break: break-word;
    }

    .msg-sucesso {
      background-color: rgba(46, 204, 113, 0.2);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }

    .msg-erro {
      background-color: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }

    .info {
      margin-top: 20px;
      padding: 12px;
      background-color: #2c2c2e;
      border-radius: 8px;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>🦊 Raposa Caçadora</h2>

    <div class="form-group">
      <label for="linkCanal">
        Link da vitrine / produto:
      </label>

      <input
        type="text"
        id="linkCanal"
        placeholder="https://meli.la/18mjK4a"
        autocomplete="off"
      >
    </div>

    <div class="form-group">
      <label for="intervalo">
        Intervalo entre postagens (minutos):
      </label>

      <input
        type="number"
        id="intervalo"
        value="30"
        min="1"
        step="1"
      >
    </div>

    <div class="form-group">
      <label for="quantidade">
        Quantidade de ofertas:
      </label>

      <input
        type="number"
        id="quantidade"
        value="5"
        min="1"
        max="50"
        step="1"
      >
    </div>

    <button
      id="btn-iniciar"
      onclick="enviarConfiguracao()"
    >
      <i class="fa-solid fa-rocket"></i>
      INICIAR POSTAGENS AUTO
    </button>

    <div id="mensagem"></div>

    <div class="info">
      🦊 Cole um link do Mercado Livre ou Natura e a Raposa
      tentará processar a oferta automaticamente.
    </div>

  </div>

  <script>

    // ============================================================
    // TELEGRAM WEB APP
    // ============================================================

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    // ============================================================
    // MENSAGENS
    // ============================================================

    function mostrarMensagem(texto, tipo) {

      const msgBox = document.getElementById("mensagem");

      msgBox.style.display = "block";

      if (tipo === "sucesso") {
        msgBox.className = "msg-sucesso";
      } else {
        msgBox.className = "msg-erro";
      }

      msgBox.innerText = texto;
    }


    // ============================================================
    // ENVIA CONFIGURAÇÃO PARA O RENDER
    // ============================================================

    async function enviarConfiguracao() {

      const btn = document.getElementById("btn-iniciar");

      const link = document
        .getElementById("linkCanal")
        .value
        .trim();

      const intervalo = document
        .getElementById("intervalo")
        .value;

      const quantidade = document
        .getElementById("quantidade")
        .value;


      // ----------------------------------------------------------
      // VALIDAÇÕES
      // ----------------------------------------------------------

      if (!link) {
        mostrarMensagem(
          "❌ Informe o link da vitrine ou produto.",
          "erro"
        );
        return;
      }

      if (!intervalo || Number(intervalo) < 1) {
        mostrarMensagem(
          "❌ O intervalo deve ser de pelo menos 1 minuto.",
          "erro"
        );
        return;
      }

      if (!quantidade || Number(quantidade) < 1) {
        mostrarMensagem(
          "❌ Informe uma quantidade válida de ofertas.",
          "erro"
        );
        return;
      }


      // ----------------------------------------------------------
      // BOTÃO
      // ----------------------------------------------------------

      btn.disabled = true;

      btn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';


      // ----------------------------------------------------------
      // DADOS
      // ----------------------------------------------------------

      const dadosParaEnviar = {

        // Dados oficiais do Telegram WebApp
        initData: tg ? tg.initData : "",

        // IMPORTANTE:
        // O Flask espera "link", não "linkCanal".
        link: link,

        // O backend trabalha internamente em segundos.
        // O usuário informa minutos.
        intervalo: Number(intervalo),

        quantidade: Number(quantidade)
      };


      console.log(
        "Enviando configuração:",
        dadosParaEnviar
      );


      try {

        const resposta = await fetch(
          "https://bot-raposa-cacadora.onrender.com/api/configurar",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify(dadosParaEnviar)
          }
        );


        // --------------------------------------------------------
        // TENTA LER JSON
        // --------------------------------------------------------

        const resultado =
          await resposta.json().catch(() => ({}));


        // --------------------------------------------------------
        // ERRO HTTP
        // --------------------------------------------------------

        if (!resposta.ok) {

          let mensagemErro =
            `Erro HTTP ${resposta.status}`;


          if (resultado) {

            if (
              typeof resultado.erro === "string"
            ) {
              mensagemErro = resultado.erro;
            }

            else if (
              typeof resultado.error === "string"
            ) {
              mensagemErro = resultado.error;
            }

            else if (
              typeof resultado.mensagem === "string"
            ) {
              mensagemErro = resultado.mensagem;
            }
          }


          mostrarMensagem(
            "❌ " + mensagemErro,
            "erro"
          );

          return;
        }


        // --------------------------------------------------------
        // SUCESSO
        // --------------------------------------------------------

        mostrarMensagem(
          "✅ " +
          (
            resultado.mensagem ||
            "Automação iniciada com sucesso!"
          ),
          "sucesso"
        );

      }


      // ----------------------------------------------------------
      // ERRO DE REDE / CORS / RENDER
      // ----------------------------------------------------------

      catch (err) {

        console.error(
          "Erro na requisição:",
          err
        );

        mostrarMensagem(
          "❌ Falha de conexão com o servidor. " +
          "Verifique o Render e o CORS.",
          "erro"
        );
      }


      // ----------------------------------------------------------
      // RESTAURA BOTÃO
      // ----------------------------------------------------------

      finally {

        btn.disabled = false;

        btn.innerHTML =
          '<i class="fa-solid fa-rocket"></i> ' +
          'INICIAR POSTAGENS AUTO';
      }
    }

  </script>

</body>
</html>

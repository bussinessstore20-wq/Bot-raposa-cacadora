<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Raposa Caçadora - Painel VIP</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>

    :root {
      --bg-gradient:
        linear-gradient(
          135deg,
          #05070a 0%,
          #0d111a 100%
        );

      --card-bg:
        rgba(15, 23, 36, 0.85);

      --card-border:
        rgba(255, 255, 255, 0.08);

      --primary-accent:
        linear-gradient(
          135deg,
          #f97316 0%,
          #ea580c 100%
        );

      --accent-glow:
        rgba(249, 115, 22, 0.45);

      --text-main:
        #f8fafc;

      --text-sub:
        #94a3b8;

      --input-bg:
        rgba(6, 10, 17, 0.9);

      --input-border:
        rgba(255, 255, 255, 0.12);

      --radius:
        16px;
    }


    * {
      box-sizing: border-box;

      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-tap-highlight-color:
        transparent;
    }


    body {
      background:
        var(--bg-gradient);

      color:
        var(--text-main);

      min-height:
        100vh;

      padding:
        20px 16px 30px;

      display:
        flex;

      flex-direction:
        column;

      gap:
        20px;
    }


    /* ========================================================
       HEADER
       ======================================================== */

    .brand-header {
      display:
        flex;

      align-items:
        center;

      gap:
        14px;

      padding:
        4px 0;
    }


    .brand-avatar {
      width:
        56px;

      height:
        56px;

      flex-shrink:
        0;

      border-radius:
        50%;

      background:
        #080b11;

      border:
        2px solid #f97316;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        28px;

      box-shadow:
        0 0 25px var(--accent-glow);
    }


    .brand-title h1 {
      font-size:
        1.25rem;

      font-weight:
        800;

      letter-spacing:
        -0.02em;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #fdba74
        );

      -webkit-background-clip:
        text;

      -webkit-text-fill-color:
        transparent;
    }


    .brand-title p {
      font-size:
        0.8rem;

      color:
        var(--text-sub);

      display:
        flex;

      align-items:
        center;

      gap:
        6px;

      margin-top:
        2px;
    }


    .status-badge {
      display:
        inline-block;

      width:
        8px;

      height:
        8px;

      background-color:
        #22c55e;

      border-radius:
        50%;

      box-shadow:
        0 0 8px #22c55e;
    }


    /* ========================================================
       CARD
       ======================================================== */

    .card {
      background:
        var(--card-bg);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      border:
        1px solid var(--card-border);

      border-radius:
        var(--radius);

      padding:
        20px;

      box-shadow:
        0 10px 30px -10px
        rgba(0, 0, 0, 0.8);
    }


    .card-title {
      font-size:
        0.9rem;

      font-weight:
        700;

      color:
        #fdba74;

      text-transform:
        uppercase;

      letter-spacing:
        0.05em;

      margin-bottom:
        16px;

      display:
        flex;

      align-items:
        center;

      gap:
        8px;
    }


    /* ========================================================
       CAMPOS
       ======================================================== */

    .field-group {
      display:
        flex;

      flex-direction:
        column;

      gap:
        8px;

      margin-bottom:
        18px;
    }


    .field-group:last-child {
      margin-bottom:
        0;
    }


    label {
      font-size:
        0.82rem;

      font-weight:
        600;

      color:
        var(--text-sub);

      display:
        flex;

      align-items:
        center;

      gap:
        6px;
    }


    .input-wrapper-paste {
      display:
        flex;

      gap:
        8px;

      align-items:
        center;
    }


    .input-wrapper {
      position:
        relative;

      flex:
        1;
    }


    .input-wrapper i {
      position:
        absolute;

      left:
        14px;

      top:
        50%;

      transform:
        translateY(-50%);

      color:
        #64748b;

      font-size:
        0.95rem;

      pointer-events:
        none;
    }


    input,
    select {
      width:
        100%;

      padding:
        14px 14px 14px 42px;

      border-radius:
        12px;

      border:
        1px solid var(--input-border);

      background:
        var(--input-bg);

      color:
        var(--text-main);

      font-size:
        0.92rem;

      outline:
        none;

      transition:
        all 0.25s ease;
    }


    input:focus,
    select:focus {
      border-color:
        #f97316;

      box-shadow:
        0 0 0 3px
        rgba(249, 115, 22, 0.2);
    }


    select option {
      background:
        #0f172a;

      color:
        #fff;
    }


    /* ========================================================
       BOTÃO COLAR
       ======================================================== */

    .btn-colar {
      background:
        rgba(249, 115, 22, 0.15);

      border:
        1px solid #f97316;

      color:
        #fdba74;

      padding:
        14px 16px;

      border-radius:
        12px;

      font-size:
        0.85rem;

      font-weight:
        700;

      cursor:
        pointer;

      display:
        flex;

      align-items:
        center;

      gap:
        6px;

      white-space:
        nowrap;

      transition:
        all 0.2s ease;
    }


    .btn-colar:active {
      transform:
        scale(0.95);

      background:
        rgba(249, 115, 22, 0.3);
    }


    /* ========================================================
       TEMPOS
       ======================================================== */

    .time-grid {
      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        8px;

      margin-top:
        6px;
    }


    .time-btn {
      background:
        var(--input-bg);

      border:
        1px solid var(--input-border);

      color:
        var(--text-sub);

      padding:
        10px 6px;

      border-radius:
        10px;

      font-size:
        0.8rem;

      font-weight:
        600;

      cursor:
        pointer;

      text-align:
        center;

      transition:
        all 0.2s ease;
    }


    .time-btn.active {
      background:
        rgba(249, 115, 22, 0.2);

      border-color:
        #f97316;

      color:
        #f97316;
    }


    /* ========================================================
       BOTÃO PRINCIPAL
       ======================================================== */

    .btn-submit {
      width:
        100%;

      background:
        var(--primary-accent);

      color:
        white;

      border:
        none;

      padding:
        16px;

      border-radius:
        var(--radius);

      font-size:
        1rem;

      font-weight:
        800;

      letter-spacing:
        0.02em;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        10px;

      cursor:
        pointer;

      box-shadow:
        0 8px 25px
        var(--accent-glow);

      transition:
        all 0.25s ease;

      margin-top:
        6px;
    }


    .btn-submit:active {
      transform:
        scale(0.98);

      box-shadow:
        0 4px 15px
        var(--accent-glow);
    }


    .btn-submit:disabled {
      opacity:
        0.7;

      cursor:
        not-allowed;
    }


    /* ========================================================
       MENSAGEM
       ======================================================== */

    .mensagem {
      display:
        none;

      padding:
        13px;

      border-radius:
        12px;

      font-size:
        0.85rem;

      text-align:
        center;

      line-height:
        1.4;
    }


    .mensagem.sucesso {
      display:
        block;

      color:
        #86efac;

      background:
        rgba(34, 197, 94, 0.10);

      border:
        1px solid
        rgba(34, 197, 94, 0.25);
    }


    .mensagem.erro {
      display:
        block;

      color:
        #fca5a5;

      background:
        rgba(239, 68, 68, 0.10);

      border:
        1px solid
        rgba(239, 68, 68, 0.25);
    }


    /* ========================================================
       FOOTER
       ======================================================== */

    .footer-note {
      text-align:
        center;

      font-size:
        0.75rem;

      color:
        var(--text-sub);

      margin-top:
        auto;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        6px;
    }


    /* ========================================================
       RESPONSIVO
       ======================================================== */

    @media (max-width: 380px) {

      .input-wrapper-paste {
        flex-direction:
          column;

        align-items:
          stretch;
      }

      .btn-colar {
        justify-content:
          center;
      }

    }

  </style>
</head>


<body>


  <!-- ======================================================
       HEADER
       ====================================================== -->

  <div class="brand-header">

    <div class="brand-avatar">
      🦊
    </div>

    <div class="brand-title">

      <h1>
        Raposa Caçadora VIP
      </h1>

      <p>
        <span class="status-badge"></span>
        Sistema de Postagens Conectado
      </p>

    </div>

  </div>


  <!-- ======================================================
       CARD PRINCIPAL
       ====================================================== -->

  <div class="card">

    <div class="card-title">

      <i class="fa-solid fa-sliders"></i>

      Painel de Automação

    </div>


    <!-- ====================================================
         LINK
         ==================================================== -->

    <div class="field-group">

      <label>

        <i class="fa-solid fa-link"></i>

        Link da Vitrine Mercado Livre

      </label>


      <div class="input-wrapper-paste">

        <div class="input-wrapper">

          <i class="fa-solid fa-store"></i>

          <input
            type="text"
            id="linkVitrine"
            placeholder="Cole aqui o link da vitrine..."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          >

        </div>


        <button
          class="btn-colar"
          type="button"
          onclick="colarLink()"
        >

          <i class="fa-solid fa-paste"></i>

          Colar

        </button>

      </div>

    </div>


    <!-- ====================================================
         INTERVALO
         ==================================================== -->

    <div class="field-group">

      <label>

        <i class="fa-solid fa-clock"></i>

        Tempo Entre Postagens

      </label>


      <div class="input-wrapper">

        <i class="fa-solid fa-stopwatch"></i>

        <select id="intervalo">

          <option value="10">
            10 Segundos (Modo Teste)
          </option>

          <option value="30">
            30 Segundos
          </option>

          <option value="60">
            1 Minuto
          </option>

          <option value="300" selected>
            5 Minutos (Recomendado)
          </option>

          <option value="1800">
            30 Minutos
          </option>

          <option value="3600">
            1 Hora
          </option>

        </select>

      </div>


      <div class="time-grid">

        <button
          type="button"
          class="time-btn"
          onclick="setTempo(10, this)"
        >
          10 seg
        </button>

        <button
          type="button"
          class="time-btn"
          onclick="setTempo(60, this)"
        >
          1 min
        </button>

        <button
          type="button"
          class="time-btn active"
          onclick="setTempo(300, this)"
        >
          5 min
        </button>

      </div>

    </div>


    <!-- ====================================================
         QUANTIDADE
         ==================================================== -->

    <div class="field-group">

      <label>

        <i class="fa-solid fa-layer-group"></i>

        Quantidade de Produtos

      </label>


      <div class="input-wrapper">

        <i class="fa-solid fa-hashtag"></i>

        <input
          type="number"
          id="quantidade"
          value="5"
          min="1"
          max="50"
          inputmode="numeric"
        >

      </div>

    </div>

  </div>


  <!-- ======================================================
       MENSAGEM
       ====================================================== -->

  <div
    id="mensagem"
    class="mensagem"
  ></div>


  <!-- ======================================================
       BOTÃO PRINCIPAL
       ====================================================== -->

  <button
    class="btn-submit"
    id="btnSubmit"
    type="button"
    onclick="enviarConfiguracao()"
  >

    <i class="fa-solid fa-rocket"></i>

    INICIAR POSTAGENS AUTO

  </button>


  <!-- ======================================================
       FOOTER
       ====================================================== -->

  <div class="footer-note">

    <i class="fa-solid fa-shield-halved"></i>

    Integração Oficial Telegram WebApp

  </div>


  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script>

    /* ======================================================
       TELEGRAM
       ====================================================== */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


    /* ======================================================
       INICIALIZA
       ====================================================== */

    if (tg) {

      tg.ready();

      tg.expand();

      if (tg.setHeaderColor) {
        tg.setHeaderColor("#05070a");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#05070a");
      }

    }


    /* ======================================================
       MOSTRAR MENSAGEM
       ====================================================== */

    function mostrarMensagem(
      texto,
      tipo
    ) {

      const elemento =
        document.getElementById(
          "mensagem"
        );

      elemento.className =
        "mensagem " + tipo;

      elemento.innerHTML =
        texto;

    }


    /* ======================================================
       COLAR LINK
       ====================================================== */

    async function colarLink() {

      const input =
        document.getElementById(
          "linkVitrine"
        );


      try {

        if (
          navigator.clipboard &&
          navigator.clipboard.readText
        ) {

          const texto =
            await navigator.clipboard.readText();


          if (texto) {

            input.value =
              texto.trim();


            if (
              tg &&
              tg.HapticFeedback
            ) {

              tg.HapticFeedback
                .notificationOccurred(
                  "success"
                );

            }

            return;

          }

        }

      } catch (erro) {

        console.warn(
          "Clipboard bloqueado:",
          erro
        );

      }


      input.focus();


      if (
        tg &&
        tg.showAlert
      ) {

        tg.showAlert(
          "Toque e segure no campo para colar o link."
        );

      }

    }


    /* ======================================================
       TEMPO RÁPIDO
       ====================================================== */

    function setTempo(
      segundos,
      elemento
    ) {

      document.getElementById(
        "intervalo"
      ).value =
        segundos;


      document
        .querySelectorAll(
          ".time-btn"
        )
        .forEach(
          function(btn) {

            btn.classList.remove(
              "active"
            );

          }
        );


      elemento.classList.add(
        "active"
      );

    }


    /* ======================================================
       ATUALIZA BOTÕES DO TEMPO
       ====================================================== */

    document
      .getElementById("intervalo")
      .addEventListener(
        "change",
        function() {

          const valor =
            parseInt(
              this.value
            );


          document
            .querySelectorAll(
              ".time-btn"
            )
            .forEach(
              function(btn) {

                btn.classList.remove(
                  "active"
                );

              }
            );


          const botoes =
            document.querySelectorAll(
              ".time-btn"
            );


          if (valor === 10) {

            botoes[0]
              .classList
              .add("active");

          }

          else if (valor === 60) {

            botoes[1]
              .classList
              .add("active");

          }

          else if (valor === 300) {

            botoes[2]
              .classList
              .add("active");

          }

        }
      );


    /* ======================================================
       ENVIA CONFIGURAÇÃO
       ====================================================== */

    async function enviarConfiguracao() {

      const btn =
        document.getElementById(
          "btnSubmit"
        );

      const link =
        document
          .getElementById(
            "linkVitrine"
          )
          .value
          .trim();


      const intervalo =
        parseInt(
          document
            .getElementById(
              "intervalo"
            )
            .value
        );


      const quantidade =
        parseInt(
          document
            .getElementById(
              "quantidade"
            )
            .value
        );


      /* ----------------------------------------------------
         VERIFICA LINK
         ---------------------------------------------------- */

      if (!link) {

        mostrarMensagem(
          "⚠️ Cole o link da vitrine antes de iniciar.",
          "erro"
        );

        if (
          tg &&
          tg.showAlert
        ) {

          tg.showAlert(
            "Cole o link da vitrine antes de iniciar."
          );

        }

        return;

      }


      /* ----------------------------------------------------
         VERIFICA QUANTIDADE
         ---------------------------------------------------- */

      if (
        !Number.isInteger(
          quantidade
        ) ||
        quantidade < 1 ||
        quantidade > 50
      ) {

        mostrarMensagem(
          "⚠️ A quantidade deve estar entre 1 e 50.",
          "erro"
        );

        return;

      }


      /* ----------------------------------------------------
         VERIFICA TELEGRAM
         ---------------------------------------------------- */

      if (!tg) {

        mostrarMensagem(
          "❌ Este aplicativo precisa ser aberto dentro do Telegram.",
          "erro"
        );

        return;

      }


      /* ----------------------------------------------------
         INIT DATA
         ---------------------------------------------------- */

      const initData =
        tg.initData || "";


      if (!initData) {

        mostrarMensagem(
          "❌ Não foi possível obter a autenticação do Telegram.",
          "erro"
        );

        if (tg.showAlert) {

          tg.showAlert(
            "Abra o painel pelo Telegram para continuar."
          );

        }

        return;

      }


      /* ----------------------------------------------------
         FEEDBACK
         ---------------------------------------------------- */

      if (
        tg.HapticFeedback
      ) {

        tg.HapticFeedback
          .impactOccurred(
            "medium"
          );

      }


      /* ----------------------------------------------------
         LOADING
         ---------------------------------------------------- */

      btn.disabled =
        true;

      btn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';


      mostrarMensagem(
        "⏳ Enviando configuração...",
        "sucesso"
      );


      /* ----------------------------------------------------
         PAYLOAD
         ---------------------------------------------------- */

      const payload = {

        link:
          link,

        intervalo:
          intervalo,

        quantidade:
          quantidade,

        initData:
          initData

      };


      try {

        /* --------------------------------------------------
           ENVIA PARA O MESMO SERVIDOR
           -------------------------------------------------- */

        const resposta =
          await fetch(
            "/api/configurar",
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        /* --------------------------------------------------
           LÊ RESPOSTA
           -------------------------------------------------- */

        const texto =
          await resposta.text();


        console.log(
          "Resposta do servidor:",
          texto
        );


        let resultado;


        try {

          resultado =
            JSON.parse(
              texto
            );

        } catch (erroJson) {

          throw new Error(
            "O servidor retornou uma resposta inválida."
          );

        }


        /* --------------------------------------------------
           VERIFICA ERRO
           -------------------------------------------------- */

        if (
          !resposta.ok ||
          !resultado.ok
        ) {

          throw new Error(
            resultado.erro ||
            "Não foi possível iniciar as postagens."
          );

        }


        /* --------------------------------------------------
           SUCESSO
           -------------------------------------------------- */

        mostrarMensagem(
          "🚀 <b>Postagens iniciadas!</b><br><br>" +
          "O sistema está processando sua vitrine.",
          "sucesso"
        );


        if (
          tg.HapticFeedback
        ) {

          tg.HapticFeedback
            .notificationOccurred(
              "success"
            );

        }


        if (tg.showAlert) {

          tg.showAlert(
            "✅ Postagens iniciadas com sucesso!"
          );

        }


        btn.innerHTML =
          '<i class="fa-solid fa-check"></i> POSTAGENS INICIADAS';


        /* --------------------------------------------------
           FECHA MINI APP
           -------------------------------------------------- */

        setTimeout(
          function() {

            if (
              tg &&
              tg.close
            ) {

              tg.close();

            }

          },
          1800
        );


      } catch (erro) {

        console.error(
          "❌ Erro:",
          erro
        );


        mostrarMensagem(
          "❌ " +
          (
            erro.message ||
            "Erro ao enviar configuração."
          ),
          "erro"
        );


        if (
          tg &&
          tg.HapticFeedback
        ) {

          tg.HapticFeedback
            .notificationOccurred(
              "error"
            );

        }


        if (
          tg &&
          tg.showAlert
        ) {

          tg.showAlert(
            "❌ " +
            (
              erro.message ||
              "Erro ao enviar configuração."
            )
          );

        }


        btn.disabled =
          false;

        btn.innerHTML =
          '<i class="fa-solid fa-rocket"></i> INICIAR POSTAGENS AUTO';

      }

    }

  </script>

</body>

</html>

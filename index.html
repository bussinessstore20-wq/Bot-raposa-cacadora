<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Raposa Caçadora - Painel VIP</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>

    :root {
      --bg: #05070a;
      --card: rgba(15, 23, 36, 0.92);
      --border: rgba(255,255,255,.08);
      --orange: #f97316;
      --orange2: #ea580c;
      --orange-light: #fdba74;
      --text: #f8fafc;
      --sub: #94a3b8;
      --input: rgba(6,10,17,.95);
      --green: #22c55e;
      --red: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        linear-gradient(
          135deg,
          #05070a 0%,
          #0d111a 100%
        );

      color: var(--text);

      min-height: 100vh;

      padding: 20px 16px 30px;

      display: flex;

      flex-direction: column;

      gap: 20px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-avatar {
      width: 56px;
      height: 56px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #080b11;

      border: 2px solid var(--orange);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;

      box-shadow:
        0 0 25px
        rgba(249,115,22,.45);
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 800;

      background:
        linear-gradient(
          90deg,
          #fff,
          var(--orange-light)
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: .8rem;
      color: var(--sub);

      display: flex;
      align-items: center;
      gap: 6px;

      margin-top: 3px;
    }

    .status-badge {
      width: 8px;
      height: 8px;

      background: var(--green);

      border-radius: 50%;

      box-shadow:
        0 0 8px var(--green);
    }

    .card {
      background: var(--card);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 20px;

      box-shadow:
        0 10px 30px -10px
        rgba(0,0,0,.8);
    }

    .card-title {
      font-size: .9rem;

      font-weight: 700;

      color: var(--orange-light);

      text-transform: uppercase;

      letter-spacing: .05em;

      margin-bottom: 18px;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;

      margin-bottom: 18px;
    }

    .field-group:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: .82rem;

      font-weight: 600;

      color: var(--sub);

      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-wrapper-paste {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .input-wrapper > i {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #64748b;

      font-size: .95rem;

      pointer-events: none;
    }

    input,
    select {
      width: 100%;

      padding:
        14px
        14px
        14px
        42px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.12);

      background: var(--input);

      color: var(--text);

      font-size: .92rem;

      outline: none;

      transition: .25s;
    }

    input:focus,
    select:focus {
      border-color: var(--orange);

      box-shadow:
        0 0 0 3px
        rgba(249,115,22,.2);
    }

    select option {
      background: #0f172a;
      color: white;
    }

    .btn-colar {
      background:
        rgba(249,115,22,.15);

      border:
        1px solid
        var(--orange);

      color: var(--orange-light);

      padding: 14px 16px;

      border-radius: 12px;

      font-size: .85rem;

      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 6px;

      white-space: nowrap;
    }

    .btn-colar:active {
      transform: scale(.95);
    }

    .time-grid {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 8px;

      margin-top: 6px;
    }

    .time-btn {
      background: var(--input);

      border:
        1px solid
        rgba(255,255,255,.12);

      color: var(--sub);

      padding: 10px 6px;

      border-radius: 10px;

      font-size: .8rem;

      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    .time-btn.active {
      background:
        rgba(249,115,22,.2);

      border-color:
        var(--orange);

      color:
        var(--orange);
    }

    .btn-submit {
      width: 100%;

      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--orange2)
        );

      color: white;

      border: none;

      padding: 16px;

      border-radius: var(--radius);

      font-size: 1rem;

      font-weight: 800;

      letter-spacing: .02em;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      cursor: pointer;

      box-shadow:
        0 8px 25px
        rgba(249,115,22,.45);

      transition: .25s;
    }

    .btn-submit:active {
      transform: scale(.98);
    }

    .btn-submit:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .mensagem {
      display: none;

      padding: 13px;

      border-radius: 12px;

      font-size: .85rem;

      text-align: center;

      line-height: 1.5;
    }

    .mensagem.sucesso {
      display: block;

      color: #86efac;

      background:
        rgba(34,197,94,.10);

      border:
        1px solid
        rgba(34,197,94,.25);
    }

    .mensagem.erro {
      display: block;

      color: #fca5a5;

      background:
        rgba(239,68,68,.10);

      border:
        1px solid
        rgba(239,68,68,.25);
    }

    .mensagem.info {
      display: block;

      color: #93c5fd;

      background:
        rgba(59,130,246,.10);

      border:
        1px solid
        rgba(59,130,246,.25);
    }

    .footer-note {
      text-align: center;

      font-size: .75rem;

      color: var(--sub);

      margin-top: auto;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;
    }

    @media(max-width:380px) {

      .input-wrapper-paste {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-colar {
        justify-content: center;
      }

    }

  </style>
</head>

<body>

  <div class="brand-header">

    <div class="brand-avatar">
      🦊
    </div>

    <div class="brand-title">

      <h1>
        Raposa Caçadora VIP
      </h1>

      <p>
        <span class="status-badge"></span>
        Sistema de Postagens Conectado
      </p>

    </div>

  </div>


  <div class="card">

    <div class="card-title">

      <i class="fa-solid fa-sliders"></i>

      Painel de Automação

    </div>


    <!-- LINK -->

    <div class="field-group">

      <label>

        <i class="fa-solid fa-link"></i>

        Link da Vitrine / Produto Mercado Livre

      </label>

      <div class="input-wrapper-paste">

        <div class="input-wrapper">

          <i class="fa-solid fa-store"></i>

          <input
            type="text"
            id="linkVitrine"
            placeholder="Cole o link da vitrine..."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          >

        </div>

        <button
          class="btn-colar"
          type="button"
          onclick="colarLink()"
        >

          <i class="fa-solid fa-paste"></i>

          Colar

        </button>

      </div>

    </div>


    <!-- INTERVALO -->

    <div class="field-group">

      <label>

        <i class="fa-solid fa-clock"></i>

        Tempo Entre Postagens

      </label>

      <div class="input-wrapper">

        <i class="fa-solid fa-stopwatch"></i>

        <select id="intervalo">

          <option value="10">
            10 Segundos (Modo Teste)
          </option>

          <option value="30">
            30 Segundos
          </option>

          <option value="60">
            1 Minuto
          </option>

          <option value="300" selected>
            5 Minutos (Recomendado)
          </option>

          <option value="1800">
            30 Minutos
          </option>

          <option value="3600">
            1 Hora
          </option>

        </select>

      </div>


      <div class="time-grid">

        <button
          type="button"
          class="time-btn"
          onclick="setTempo(10,this)"
        >
          10 seg
        </button>

        <button
          type="button"
          class="time-btn"
          onclick="setTempo(60,this)"
        >
          1 min
        </button>

        <button
          type="button"
          class="time-btn active"
          onclick="setTempo(300,this)"
        >
          5 min
        </button>

      </div>

    </div>


    <!-- QUANTIDADE -->

    <div class="field-group">

      <label>

        <i class="fa-solid fa-layer-group"></i>

        Quantidade de Produtos

      </label>

      <div class="input-wrapper">

        <i class="fa-solid fa-hashtag"></i>

        <input
          type="number"
          id="quantidade"
          value="5"
          min="1"
          max="50"
          inputmode="numeric"
        >

      </div>

    </div>

  </div>


  <div
    id="mensagem"
    class="mensagem"
  ></div>


  <button
    class="btn-submit"
    id="btnSubmit"
    type="button"
    onclick="enviarConfiguracao()"
  >

    <i class="fa-solid fa-rocket"></i>

    INICIAR POSTAGENS AUTO

  </button>


  <div class="footer-note">

    <i class="fa-solid fa-shield-halved"></i>

    Integração Oficial Telegram WebApp

  </div>


<script>

  /* =========================================================
     TELEGRAM WEB APP
     ========================================================= */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  if (tg) {

    tg.ready();

    tg.expand();

    if (tg.setHeaderColor) {
      tg.setHeaderColor("#05070a");
    }

    if (tg.setBackgroundColor) {
      tg.setBackgroundColor("#05070a");
    }

  }


  /* =========================================================
     MENSAGEM
     ========================================================= */

  function mostrarMensagem(texto, tipo) {

    const elemento =
      document.getElementById("mensagem");

    elemento.className =
      "mensagem " + tipo;

    elemento.innerHTML =
      texto;

  }


  /* =========================================================
     COLAR
     ========================================================= */

  async function colarLink() {

    const input =
      document.getElementById("linkVitrine");


    try {

      if (
        navigator.clipboard &&
        navigator.clipboard.readText
      ) {

        const texto =
          await navigator.clipboard.readText();


        if (texto) {

          input.value =
            texto.trim();

          input.dispatchEvent(
            new Event("input")
          );


          if (
            tg &&
            tg.HapticFeedback
          ) {

            tg.HapticFeedback
              .notificationOccurred(
                "success"
              );

          }

          return;

        }

      }

    } catch (erro) {

      console.warn(
        "Clipboard bloqueado:",
        erro
      );

    }


    input.focus();


    if (
      tg &&
      tg.showAlert
    ) {

      tg.showAlert(
        "Toque e segure no campo para colar o link."
      );

    }

  }


  /* =========================================================
     TEMPO
     ========================================================= */

  function setTempo(segundos, elemento) {

    document.getElementById(
      "intervalo"
    ).value = segundos;


    document
      .querySelectorAll(".time-btn")
      .forEach(
        function(btn) {

          btn.classList.remove(
            "active"
          );

        }
      );


    elemento.classList.add(
      "active"
    );

  }


  document
    .getElementById("intervalo")
    .addEventListener(
      "change",
      function() {

        const valor =
          parseInt(this.value);


        document
          .querySelectorAll(".time-btn")
          .forEach(
            function(btn) {

              btn.classList.remove(
                "active"
              );

            }
          );


        const botoes =
          document.querySelectorAll(
            ".time-btn"
          );


        if (valor === 10) {

          botoes[0]
            .classList
            .add("active");

        }

        else if (valor === 60) {

          botoes[1]
            .classList
            .add("active");

        }

        else if (valor === 300) {

          botoes[2]
            .classList
            .add("active");

        }

      }
    );


  /* =========================================================
     VALIDAR LINK
     ========================================================= */

  function validarLink(link) {

    if (!link) {
      return false;
    }

    try {

      const url =
        new URL(link);

      return (
        url.protocol === "http:" ||
        url.protocol === "https:"
      );

    } catch (erro) {

      return false;

    }

  }


  /* =========================================================
     ENVIAR CONFIGURAÇÃO
     ========================================================= */

  async function enviarConfiguracao() {

    const btn =
      document.getElementById(
        "btnSubmit"
      );


    const inputLink =
      document.getElementById(
        "linkVitrine"
      );


    const link =
      inputLink.value.trim();


    const intervalo =
      parseInt(
        document
          .getElementById(
            "intervalo"
          )
          .value
      );


    const quantidade =
      parseInt(
        document
          .getElementById(
            "quantidade"
          )
          .value
      );


    /* -------------------------------------------------------
       LINK
       ------------------------------------------------------- */

    if (!link) {

      mostrarMensagem(
        "⚠️ Cole o link da vitrine ou do produto antes de iniciar.",
        "erro"
      );

      return;

    }


    if (!validarLink(link)) {

      mostrarMensagem(
        "⚠️ Informe um link válido começando com http:// ou https://.",
        "erro"
      );

      return;

    }


    /* -------------------------------------------------------
       QUANTIDADE
       ------------------------------------------------------- */

    if (
      !Number.isInteger(quantidade) ||
      quantidade < 1 ||
      quantidade > 50
    ) {

      mostrarMensagem(
        "⚠️ A quantidade deve estar entre 1 e 50.",
        "erro"
      );

      return;

    }


    /* -------------------------------------------------------
       TELEGRAM
       ------------------------------------------------------- */

    if (!tg) {

      mostrarMensagem(
        "❌ Este painel precisa ser aberto dentro do Telegram.",
        "erro"
      );

      return;

    }


    const initData =
      tg.initData || "";


    if (!initData) {

      mostrarMensagem(
        "❌ Não foi possível obter a autenticação do Telegram.",
        "erro"
      );

      if (tg.showAlert) {

        tg.showAlert(
          "Abra o painel pelo Telegram para continuar."
        );

      }

      return;

    }


    /* -------------------------------------------------------
       LOADING
       ------------------------------------------------------- */

    btn.disabled = true;

    btn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';


    mostrarMensagem(
      "⏳ Enviando configuração para o servidor...",
      "info"
    );


    /* -------------------------------------------------------
       PAYLOAD
       ------------------------------------------------------- */

    const payload = {

      link: link,

      intervalo: intervalo,

      quantidade: quantidade,

      initData: initData

    };


    console.log(
      "📤 Enviando para:",
      window.location.origin +
      "/api/configurar"
    );

    console.log(
      "📦 Payload:",
      {
        link: link,
        intervalo: intervalo,
        quantidade: quantidade,
        initData: initData
          ? "RECEBIDO"
          : "VAZIO"
      }
    );


    try {

      /* =====================================================
         IMPORTANTE:

         A requisição é feita para o MESMO servidor
         que está servindo este index.html.

         Portanto:

         /app
         /api/configurar

         pertencem ao mesmo domínio.
         ===================================================== */

      const endpoint =
        window.location.origin +
        "/api/configurar";


      const resposta =
        await fetch(
          endpoint,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "Accept":
                "application/json"

            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      /* -----------------------------------------------------
         LER TEXTO PRIMEIRO
         ----------------------------------------------------- */

      const texto =
        await resposta.text();


      console.log(
        "📥 HTTP:",
        resposta.status
      );

      console.log(
        "📥 Resposta:",
        texto
      );


      /* -----------------------------------------------------
         RESPOSTA VAZIA
         ----------------------------------------------------- */

      if (!texto) {

        throw new Error(
          "O servidor retornou uma resposta vazia. HTTP " +
          resposta.status
        );

      }


      /* -----------------------------------------------------
         JSON
         ----------------------------------------------------- */

      let resultado;

      try {

        resultado =
          JSON.parse(texto);

      } catch (erroJson) {

        console.error(
          "Resposta não JSON:",
          texto
        );

        throw new Error(
          "O servidor retornou uma resposta inválida. HTTP " +
          resposta.status
        );

      }


      /* -----------------------------------------------------
         ERRO HTTP
         ----------------------------------------------------- */

      if (!resposta.ok) {

        throw new Error(
          resultado.erro ||
          resultado.detalhe ||
          (
            "Erro HTTP " +
            resposta.status
          )
        );

      }


      /* -----------------------------------------------------
         ERRO DA API
         ----------------------------------------------------- */

      if (
        resultado.ok !== true
      ) {

        throw new Error(
          resultado.erro ||
          resultado.detalhe ||
          "Não foi possível iniciar as postagens."
        );

      }


      /* -----------------------------------------------------
         SUCESSO
         ----------------------------------------------------- */

      mostrarMensagem(
        "🚀 <b>Postagens iniciadas!</b><br><br>" +
        "O servidor recebeu sua vitrine e começou o processamento.",
        "sucesso"
      );


      if (
        tg.HapticFeedback
      ) {

        tg.HapticFeedback
          .notificationOccurred(
            "success"
          );

      }


      if (tg.showAlert) {

        tg.showAlert(
          "✅ Postagens iniciadas com sucesso!"
        );

      }


      btn.innerHTML =
        '<i class="fa-solid fa-check"></i> POSTAGENS INICIADAS';


      /* -----------------------------------------------------
         FECHAR MINI APP
         ----------------------------------------------------- */

      setTimeout(
        function() {

          if (
            tg &&
            tg.close
          ) {

            tg.close();

          }

        },
        1800
      );


    } catch (erro) {

      console.error(
        "❌ ERRO COMPLETO:",
        erro
      );


      const mensagemErro =
        erro &&
        erro.message
          ? erro.message
          : "Erro ao enviar configuração.";


      mostrarMensagem(
        "❌ <b>Erro:</b><br>" +
        escapeHtml(mensagemErro),
        "erro"
      );


      if (
        tg &&
        tg.HapticFeedback
      ) {

        tg.HapticFeedback
          .notificationOccurred(
            "error"
          );

      }


      if (
        tg &&
        tg.showAlert
      ) {

        tg.showAlert(
          "❌ " +
          mensagemErro
        );

      }


      btn.disabled =
        false;

      btn.innerHTML =
        '<i class="fa-solid fa-rocket"></i> INICIAR POSTAGENS AUTO';

    }

  }


  /* =========================================================
     ESCAPAR HTML
     ========================================================= */

  function escapeHtml(texto) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      texto;

    return div.innerHTML;

  }

</script>

</body>

</html>
